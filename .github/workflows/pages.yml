name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build static site with public URL
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          python build_site.py
          python - <<'PY'
          from pathlib import Path
          p = Path('privacidade/index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<meta name="robots" content="index,follow">'
          canonical = f'<link rel="canonical" href="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/privacidade/">'
          if 'rel="canonical"' not in s:
              s = s.replace(marker, marker + canonical, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
