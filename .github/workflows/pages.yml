name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build static site with public URL
        env:
          SITE_URL: https://fonsecatools.com.br
          GA_MEASUREMENT_ID: G-FSGL7Y81H5
          ADSENSE_CLIENT: ca-pub-2932363909264829
        run: |
          python expand_tools_v2.py
          python seo_enhance.py
          python architecture_enhance.py
          python analytics_events.py
          python postbuild.py
          node --check assets/app.js
          python validate_build.py
          python validate_analytics.py
          python validate_adsense.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
